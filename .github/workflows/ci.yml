name: CI — Dev Branch

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitness_dev
      PORT: 8001
      ENV: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r fitness_app/requirements.txt
          pip install pytest pytest-asyncio 
          
      - name: Run database migrations
        run: |
          python db/migrate.py

      - name: Check app starts (import test)
        run: |
          cd fitness_app
          python -c "import main; print('✅ main.py imports OK')"

      - name: Run tests (if any exist)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "⚠️  No tests directory found — skipping. Consider adding tests/."
          fi
