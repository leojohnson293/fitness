
name: CD — Deploy to Prod
 
on:
  push:
    branches: [main]
 
jobs:
  deploy:
    runs-on: self-hosted  # your Mac runner
 
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
 
      - name: Build and restart prod container
        run: |
          cd fitness_app
          pip install -r requirements.txt --break-system-packages
 
      - name: Run migrations and restart prod server
        run: |
         # Stop and remove existing prod container (same project name every time)
          docker compose -f docker-compose.prod.yml -p fitness-prod down
 
          # Rebuild image and start fresh
          docker compose -f docker-compose.prod.yml -p fitness-prod up --build -d
 
          echo "✅ Prod container restarted on port 8000"
          echo "📋 Logs: docker compose -f docker-compose.prod.yml logs -f"