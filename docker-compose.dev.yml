services:
  app:
    build: .
    image: fitness-app:dev
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://leom.johnson:password@host.docker.internal:5432/fitness_dev
      - PORT=8000
      - ENV=dev
    volumes:
      - ./fitness_app:/app        # live reload — changes on disk reflect instantly
      - ./db:/db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
